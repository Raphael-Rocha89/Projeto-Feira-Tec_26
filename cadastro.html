<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Página de Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="body-cad">
    <div class="cadastro">
        <h1 class="t-cadastro">Cadastro</h1>
        <p class="sub-cadastro">Crie sua conta</p>
        <form>
            <label for="nome" class="campo">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" class="campo-i">

            <label for="email" class="campo">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" class="campo-i">

            <label for="usuario" class="campo">Usuário</label>
            <input type="text" id="usuario" name="usuario" placeholder="Crie um usuário" class="campo-i">

            <label for="senha" class="campo">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha" class="campo-i">

            <label for="confirmarSenha" class="campo">Confirmar senha</label>
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Digite a senha novamente" class="campo-i">

            <button type="submit" class="button-cad">
                Cadastrar
            </button>
        </form>
        <p class="sub-cadastro">
            Já possui uma conta?
            <a href="login.html" class="link-c">Faça login</a>
        </p>
    </div>
</body>

</html>
