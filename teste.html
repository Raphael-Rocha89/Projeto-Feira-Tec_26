<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Gráfico de Fatias</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <h1>Minhas tecnologias</h1>

    <div class="grafico-container" style="width: 200px; margin: 20px auto;">
        <canvas id="grafico"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('grafico');

        new Chart(ctx, {
            type: 'doughnut',

            data: {
                labels: ['Consumo do mês atual', 'Consumo do mês anterior', 'Estimativa total', 'N/A'],

                datasets: [{
                    data: [70, 30, 90, 10],

                    backgroundColor: [
                        'rgb(25, 25, 155)',
                        'rgb(75, 75, 225)',
                        'rgb(65, 225, 75)',
                        'rgb(155, 155, 155)'
                    ],

                    borderWidth: 1
                }]
            },

            options: {
                plugins: {
                    tooltip: {
                        enabled: true,
                    },
                    title: {
                        display: true,
                        text: 'Gráfico de Fatias Teste'
                    },
                    legend: {
                        display: false,
                    }
                },
                rotation: -110,
                circumference: 220,

                cutout: '80%'
            }
        });
    </script>
</body>

</html>
