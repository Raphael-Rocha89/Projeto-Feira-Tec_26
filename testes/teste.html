<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Gráfico de Fatias</title>
    <link rel="stylesheet" href="styletest.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <h1>Minhas tecnologias</h1>

    <div class="grafico-container" style="width: 200px; margin: 20px auto;">
        <canvas id="grafico"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('grafico');

        new Chart(ctx, {
            type: 'doughnut',

            data: {
                labels: ['Consumo do mês atual', 'Consumo do mês anterior', 'Estimativa total', 'N/A'],

                datasets: [{
                    data: [70, 30, 90, 10],

                    backgroundColor: [
                        'rgb(25, 25, 155)',
                        'rgb(75, 75, 225)',
                        'rgb(65, 225, 75)',
                        'rgb(155, 155, 155)'
                    ],

                    borderWidth: 1
                }]
            },

            options: {
                plugins: {
                    tooltip: {
                        enabled: true,
                    },
                    title: {
                        display: true,
                        text: 'Gráfico de Fatias Teste'
                    },
                    legend: {
                        display: false,
                    }
                },
                rotation: -110,
                circumference: 220,

                cutout: '80%'
            }
        });
    </script>

    <section class="parallax">
    <div class="parallax-bg"></div>

    <div class="parallax-content">
        <h1>Meu site</h1>
        <p>Uma experiência visual moderna.</p>
    </div>
</section>

<section class="conteudo">
    <h2>Próxima seção</h2>
    <p>
        Aqui começa o restante do conteúdo do site.
    </p>
</section>
<script>
    const parallax = document.querySelector(".parallax");
    const background = document.querySelector(".parallax-bg");

let currentScroll = 0;
let targetScroll = 0;

function animate() {

    targetScroll = window.scrollY;

    currentScroll += (targetScroll - currentScroll) * 0.08;

    const rect = parallax.getBoundingClientRect();

    const progress = -rect.top / parallax.offsetHeight;

    const moveY = progress * -150;
    const zoom = 1.1 + progress * 0.15;

    background.style.transform =
        `translateY(${moveY}px) scale(${zoom})`;

    requestAnimationFrame(animate);
}

animate();
</script>
</body>

</html>
