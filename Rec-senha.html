<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Página de Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="body-log">
    <div class="base">
        <div class="login">
            <img src="imagens/envelope.png" class="icn-rec">
            <h1 class="t-cadastro">Recuperar senha</h1>
            <p class="sub-cadastro">Receba um código de verificação</p>

            <form>
                <label for="usuario" class="campo">Usuário</label>
                <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" class="campo-i">
                
                <label for="senha" class="campo">email</label>
                <input type="email" id="senha" name="senha" placeholder="Digite o email de recuperação" class="campo-i">
                
                <button type="submit" class="button-cad">Solicitar código</button>
            </form>

            <p class="sub-cadastro">
                Teve sua conta acessada de algum dispositivo suspeito?
                <a href="cadastro.html" class="link-c">Proteger minha senha</a>
            </p>
        </div>
    </div>
</body>

</html>
