<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Página de Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="body-log">
    <div class="base">
        <div class="login">
            <h1 class="t-cadastro">Login</h1>
            <p class="sub-cadastro">Entre na sua conta</p>

            <form id="login-form">
                <label for="usuario" class="campo">Usuário</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Digite seu usuário"
                    class="campo-i">

                <label for="senha" class="campo">Senha</label>
                <input type="password" id="senha" name="senha" required placeholder="Digite sua senha" class="campo-i" minlength="8">

                <button type="submit" class="button-cad" id="button-cad" disabled>Entrar</button>
            </form>
            <script>
                const formulario = document.getElementById('login-form');
                const botao = document.getElementById('button-cad');

                formulario.addEventListener('input', () => {
                    botao.disabled = !formulario.checkValidity();
                });
            </script>

            <a href="Rec-senha.html" class="link-c">Esqueci minha senha</a>
            <p class="sub-cadastro">
                Ainda não possui uma conta?
                <a href="cadastro.html" class="link-c">Cadastre-se</a>
            </p>
        </div>
    </div>
</body>

</html>
